name: CI/CD Pipeline
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality-check:
    name: Lint and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-project

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff code check
        run: uv run ruff check .

  test:
    name: Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_test
        options: >-
          --health-cmd "pg_isready -U postgres -d db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "5432:5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-project

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          MOODLE_SERVICE_TOKEN: ""

      - name: Run testing
        run: uv run pytest --maxfail=3 --disable-warnings
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          MOODLE_SERVICE_TOKEN: ""

  build-and-publish:
    name: Build image and publish image
    needs: [quality-check, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Clone source code
        uses: actions/checkout@v7

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadatos from Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
